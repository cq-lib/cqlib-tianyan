language = "C"
pragma_once = true
documentation_style = "c"
documentation = true
header = "/* Generated by cbindgen. Do not edit manually. */"
include_guard = "CQLIB_TIANYAN_H"

# Forward-declare opaque handle types that cbindgen cannot lay out
# (their inner Rust fields are from a dependency crate).
after_includes = """
/* ── Opaque handle types ─────────────────────────────────────────────────── */

/** Opaque handle for TianyanBackend.  Use tianyan_backend_* functions. */
typedef struct TianyanBackendC TianyanBackendC;

/** Opaque handle for TianyanTask.  Use tianyan_task_* functions. */
typedef struct TianyanTaskC TianyanTaskC;

/** Opaque list of execution results.  Use tianyan_result_* functions. */
typedef struct TianyanResultList TianyanResultList;
"""

[export]
# Force-include these opaque types so cbindgen emits function signatures
# that reference them.
include = ["TianyanBackendC", "TianyanTaskC", "TianyanResultList",
           "TianyanPlatformC", "TianyanConfigC", "TianyanFusionC"]

[parse]
parse_deps = true
include = ["binding-c"]
