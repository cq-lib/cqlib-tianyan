[workspace]
members = [
    "crates/binding-c",
    "crates/binding-python",
    "crates/cqlib-tianyan",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
license-file = "LICENSE.txt"
authors = ["Cqlib Development Team <tianyan@chinatelecom.cn >"]
description = "client for the Tianyan quantum cloud platform — authentication, device management, circuit submission, and readout error mitigation."
repository = "https://github.com/cq-lib/cqlib-tianyan"
homepage = "https://qc.zdxlz.com/cqlib"
keywords = ["quantum", "tianyan", "quantum-computing"]
categories = ["api-bindings", "science"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
dirs = "5"
cqlib-core = "0.1.0-beta.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "macros"] }
rustworkx-core = "0.17.1"
