[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "cqlib-tianyan"
description = "Python client for the Tianyan quantum cloud platform."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Cqlib Development Team", email = "tianyan@chinatelecom.cn" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["cqlib>=2.0.0b1"]
dynamic = ["version"]

# No-op extra kept so `pip install cqlib-tianyan[cqlib]` from older docs still works.
[project.optional-dependencies]
cqlib = []

[project.urls]
Homepage = "https://qc.zdxlz.com/cqlib"
Repository = "https://github.com/cq-lib/cqlib-tianyan"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
markers = [
    "integration: marks tests as requiring API access (may be slow)",
    "slow: marks tests as slow (long timeouts, waits for results)",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "cqlib_tianyan._cqlib_tianyan"
include-python-files = ["cqlib_tianyan/**", ]
include = [{ path = "cqlib_tianyan/py.typed", format = ["sdist", "wheel"] }]
exclude = [
    "cqlib_tianyan/**/__pycache__",
    "cqlib_tianyan/**/*.pyc",
]
sdist-include = ["Cargo.toml", "Cargo.lock", "src/**/*", "cqlib_tianyan/**/*"]
